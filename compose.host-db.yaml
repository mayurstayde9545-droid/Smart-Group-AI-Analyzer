services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL:?Set DB_URL in .env to your MySQL Server on the PC}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PORT: 8080
    ports:
      - "8080:8080"
